<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080810;color:#fff}
header{padding:20px 6%;background:#10101c;border-bottom:1px solid #292940;display:flex;align-items:center;gap:25px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold;color:#8b6cff}
nav{display:flex;gap:20px;flex:1}
nav a{color:#ccc;text-decoration:none}
nav a:hover{color:#8b6cff}
#search{background:#181827;border:1px solid #303047;color:white;padding:11px 15px;border-radius:8px}
.hero{text-align:center;padding:90px 20px;background:linear-gradient(135deg,#0c0c19,#17132b)}
.hero h1{font-size:50px;margin-bottom:15px}
.hero p{color:#aaa;font-size:18px;margin-bottom:25px}
button{border:0;background:#8b6cff;color:#fff;padding:11px 18px;border-radius:8px;cursor:pointer;font-weight:bold}
button:hover{background:#a08aff}
main{max-width:1200px;margin:auto}
section{padding:55px 20px}
h2{margin-bottom:25px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.game-card{background:#12121f;border:1px solid #292940;border-radius:14px;padding:20px;transition:.2s}
.game-card:hover{transform:translateY(-5px);border-color:#8b6cff}
.game-image{height:150px;background:#1b1b2b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:65px;margin-bottom:15px}
.game-card p{color:#999;margin:8px 0 15px}
.categories{display:flex;gap:10px;flex-wrap:wrap}
footer{text-align:center;padding:30px;color:#777;border-top:1px solid #222}
@media(max-width:700px){.hero h1{font-size:38px}#search{width:100%}}
</style>
</head>
<body>
<header>
<div class="logo">🎮 Game Hub</div>
<nav><a href="#">Home</a><a href="#games">Games</a><a href="#categories">Categories</a></nav>
<input id="search" placeholder="Search games..." aria-label="Search games">
</header>

<main>
<section class="hero">
<h1>Welcome to Game Hub</h1>
<p>Play awesome games right in your browser.</p>
<button id="browse">Browse Games</button>
</section>

<section id="games">
<h2>🎮 Games</h2>
<div class="game-grid">
<div class="game-card" data-name="Snake"><div class="game-image">🐍</div><h3>Snake</h3><p>Classic snake game.</p><button class="play">Play</button></div>
<div class="game-card" data-name="Space Runner"><div class="game-image">🚀</div><h3>Space Runner</h3><p>Dodge obstacles in space.</p><button class="play">Play</button></div>
<div class="game-card" data-name="Racing"><div class="game-image">🏎️</div><h3>Racing</h3><p>Race against the clock.</p><button class="play">Play</button></div>
<div class="game-card" data-name="Puzzle"><div class="game-image">🧩</div><h3>Puzzle</h3><p>Test your brain.</p><button class="play">Play</button></div>
</div>
</section>

<section id="categories">
<h2>🏷️ Categories</h2>
<div class="categories"><button>Action</button><button>Racing</button><button>Puzzle</button><button>Arcade</button></div>
</section>
</main>

<footer>© 2026 Game Hub</footer>

<script>
const search=document.getElementById("search");
const cards=document.querySelectorAll(".game-card");
search.addEventListener("input",()=>{
 const q=search.value.toLowerCase();
 cards.forEach(card=>card.style.display=card.dataset.name.toLowerCase().includes(q)?"block":"none");
});
document.getElementById("browse").addEventListener("click",()=>document.getElementById("games").scrollIntoView({behavior:"smooth"}));
document.querySelectorAll(".play").forEach(button=>{
 button.addEventListener("click",()=>{
  const name=button.parentElement.dataset.name;
  alert(name+" will be added as a playable game next!");
 });
});
</script>
</body>
</html>
