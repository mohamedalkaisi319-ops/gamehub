```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0b12;
        color: white;
    }

    header {
        background: #12121c;
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid #7c3cff;
    }

    header h1 {
        margin: 0;
        color: #9b5cff;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        padding: 30px;
    }

    .add-game {
        background: #151522;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 30px;
        box-shadow: 0 0 20px rgba(124, 60, 255, 0.2);
    }

    .add-game h2 {
        color: #9b5cff;
        margin-top: 0;
    }

    input {
        width: calc(100% - 24px);
        padding: 12px;
        margin: 8px 0;
        background: #0d0d16;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        padding: 12px 20px;
        background: #7c3cff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 8px;
    }

    button:hover {
        background: #9b5cff;
    }

    .games {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 20px;
    }

    .game {
        background: #151522;
        padding: 20px;
        border-radius: 15px;
        border: 1px solid #29293b;
    }

    .game h3 {
        color: #b98aff;
        margin-top: 0;
    }

    .play {
        display: inline-block;
        text-decoration: none;
        color: white;
        background: #7c3cff;
        padding: 10px 18px;
        border-radius: 8px;
        margin-top: 10px;
    }

    .play:hover {
        background: #9b5cff;
    }

    .delete {
        background: #d33;
        margin-left: 5px;
    }

    .delete:hover {
        background: #f44;
    }

    .empty {
        color: #888;
        text-align: center;
        grid-column: 1 / -1;
    }
</style>
</head>

<body>

<header>
    <h1>🎮 Game Hub</h1>
</header>

<div class="container">

    <div class="add-game">
        <h2>➕ Add Your Own Game</h2>

        <input
            type="text"
            id="gameName"
            placeholder="Game Name (example: Subway Surfers)"
        >

        <input
            type="url"
            id="gameLink"
            placeholder="Game Link (example: https://example.com/game)"
        >

        <button onclick="addGame()">Add Game</button>
    </div>

    <h2>🎮 My Games</h2>

    <div class="games" id="gamesList"></div>

</div>

<script>

function loadGames() {

    const games = JSON.parse(localStorage.getItem("myGames")) || [];

    const gamesList = document.getElementById("gamesList");

    gamesList.innerHTML = "";

    if (games.length === 0) {
        gamesList.innerHTML =
            '<p class="empty">No games added yet. Add your first game above!</p>';
        return;
    }

    games.forEach((game, index) => {

        const gameDiv = document.createElement("div");

        gameDiv.className = "game";

        gameDiv.innerHTML = `
            <h3>🎮 ${escapeHTML(game.name)}</h3>

            <a
                class="play"
                href="${game.link}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ▶ Play
            </a>

            <button class="delete" onclick="deleteGame(${index})">
                Delete
            </button>
        `;

        gamesList.appendChild(gameDiv);
    });
}


function addGame() {

    const name = document.getElementById("gameName").value.trim();
    const link = document.getElementById("gameLink").value.trim();

    if (name === "" || link === "") {
        alert("Please enter both a game name and a game link!");
        return;
    }

    try {
        new URL(link);
    } catch {
        alert("Please enter a valid game link, such as https://example.com");
        return;
    }

    const games = JSON.parse(localStorage.getItem("myGames")) || [];

    games.push({
        name: name,
        link: link
    });

    localStorage.setItem("myGames", JSON.stringify(games));

    document.getElementById("gameName").value = "";
    document.getElementById("gameLink").value = "";

    loadGames();
}


function deleteGame(index) {

    const games = JSON.parse(localStorage.getItem("myGames")) || [];

    games.splice(index, 1);

    localStorage.setItem("myGames", JSON.stringify(games));

    loadGames();
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


loadGames();

</script>

</body>
</html>
